<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page URL carries the Prolific ID: never send it to other sites as a referrer. -->
<meta name="referrer" content="no-referrer">
<!-- Scripts only from this site and the pinned unpkg files; data may only be sent to DataPipe. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com 'unsafe-inline'; img-src 'self' data:; font-src data:; connect-src https://pipe.jspsych.org; form-action 'none'; base-uri 'none'">
<title>Sentence choice study</title>
<!-- Exact files, with integrity hashes: the browser refuses them if unpkg ever serves anything else. -->
<script src="https://unpkg.com/jspsych@8.3.0/dist/index.browser.min.js" integrity="sha384-PPMNzYQfqrWFhrOxhpwxXmKK+LDH//fBCLsvA/JIRHOfiuOcZ2j8wJhqo87V4R4B" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.min.js" integrity="sha384-JyKpJgu7DU4Cgu1+TTOMRxkNWsYCT5ENOipB9fwXibgV4+N2XZXtlfyjbkMv8Hgp" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0/dist/index.browser.min.js" integrity="sha384-tPGtXEC8xEbInWvarnxvJ3fyzeXwRDS0QjGUts+TGQ9I8OCxiqsv9lxTS3mEN6um" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0/dist/index.browser.min.js" integrity="sha384-60fiNESvg3n32x9sx0QAOyIlVkUgaC20Fsuo/ROTm0DeXCwEfaJ0FfE674kO0F9n" crossorigin="anonymous"></script>
<script src="https://unpkg.com/datapipe-client@0.2.0/dist/datapipe-client.browser.global.js" integrity="sha384-W8uPKVLfjX0nDUVMGaeUlrKcLf/09yz2PVW+L/P5PtBa17vXVyn8KPmZK1Du0Xzk" crossorigin="anonymous"></script>
<link  href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" integrity="sha384-+gGUkbtw2BJWSroKW2jzIEXGe7KxdycJ0Bo+CqzpIOSBHOYEHHRWETaV+v2mpdWX" crossorigin="anonymous" rel="stylesheet">
<script src="stimuli.js?v=5095292af4"></script>
<script src="exp.js?v=5095292af4"></script>
<style>
  body { background:#fff; font-family: "Helvetica Neue", Arial, sans-serif; color:#222; }
  .jspsych-content { max-width: 760px; }
  h2 { font-weight:600; font-size:1.25rem; margin-bottom:.6rem; }
  .body { text-align:left; line-height:1.55; font-size:1rem; color:#333; }
  /* every trial screen is centred on the same point, so the eye does not have to move */
  .fix  { font-size:2.4rem; color:#888; }
  /* context screen and choice screen share one layout; see trialHTML in exp.js */
  .ctx  { font-size:1.35rem; line-height:1.5; max-width:620px; margin:0 auto 34px; transition:color .15s; }
  .choice { visibility:hidden; }                   /* reserves the space, so nothing moves */
  .choosing .choice { visibility:visible; }
  .choosing .ctx { color:#9aa0a8; }                /* same size and place, just greyed */
  .frame { font-size:1.35rem; line-height:1.5; margin-bottom:28px; }
  .gap  { display:inline-block; min-width:3.2em; border-bottom:2px solid #5b6e8c; color:transparent; }
  .opts { display:flex; gap:40px; justify-content:center; }
  .opt  { min-width:160px; padding:12px 18px; border:1px solid #d6dbe1; border-radius:8px; }
  .key  { display:inline-block; font-weight:700; font-size:.75rem; color:#fff; background:#5b6e8c;
          border-radius:4px; padding:1px 7px; margin-bottom:8px; }
  .form { font-size:1.25rem; font-weight:600; }
  .slow { font-size:1.1rem; color:#a33; }
  kbd   { background:#eee; border:1px solid #ccc; border-radius:3px; padding:1px 5px; }
</style>
</head>
<body>
<script src="main.js?v=5095292af4"></script>
</body>
</html>
